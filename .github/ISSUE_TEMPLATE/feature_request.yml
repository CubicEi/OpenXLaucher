name: Feature Request
description: 提议新功能或现有功能改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议。请重点描述需要解决的问题，以及该功能能为用户带来的价值。

  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 你在什么场景下遇到了什么困难？
      placeholder: 当我……时，目前只能……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 请描述你希望 RTLauncher 如何解决这个问题。
      placeholder: 希望能够……
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你是否尝试过其他方法或考虑过其他设计？

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - 启动与实例管理
        - 下载与资源管理
        - 账号与认证
        - 联机功能
        - 设置与界面
        - 构建与发布
        - 其他
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 验收标准
      description: 满足哪些条件时，可以认为该功能已经完成？
      placeholder: |
        - [ ] 用户可以……
        - [ ] 失败时会……

  - type: textarea
    id: additional-context
    attributes:
      label: 补充信息
      description: 可以添加草图、截图、参考项目或相关链接。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认没有相同或高度相似的建议。
          required: true
